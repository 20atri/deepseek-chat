<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek Chat</title>
    <link rel="stylesheet" href="style.css">
    <!-- 引入 Font Awesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- 应用主容器 -->
    <div class="app-container">
        <!-- 聊天区域 -->
        <div class="chat-area">
            <!-- 聊天区域头部 -->
            <div class="chat-header">
                 <!-- 设置按钮 -->
                 <button id="settings-button" title="设置">
                    <i class="fas fa-cog"></i> <!-- 齿轮图标 -->
                </button>
            </div>
            <!-- 聊天消息容器 -->
            <div id="chat-container">
                <!-- 消息将在这里动态添加 -->
            </div>

            <!-- 消息输入区域 -->
            <div id="message-input-container">
                <!-- 滚动控制按钮 -->
                <button id="scroll-control-btn" title="页面滚动">
                    <i class="fas fa-chevron-up"></i>
                </button>

                <!-- 滚动控制 Popover -->
                <div id="scroll-popover" class="popover hidden">
                    <div class="popover-section-label">页面滚动</div>
                    <button id="scroll-to-top-btn" class="popover-btn">
                        <i class="fas fa-angle-double-up"></i> 一键置顶
                    </button>
                    <button id="scroll-to-bottom-btn" class="popover-btn">
                        <i class="fas fa-angle-double-down"></i> 一键到底
                    </button>
                    <div class="popover-divider"></div>
                    <div class="popover-section-label">思维链控制</div>
                    <button id="hide-all-reasoning-btn" class="popover-btn">
                        <i class="fas fa-eye-slash"></i> 隐藏所有思维链
                    </button>
                    <button id="show-all-reasoning-btn" class="popover-btn">
                        <i class="fas fa-eye"></i> 展开所有思维链
                    </button>
                </div>

                <textarea id="user-input" placeholder="输入你的消息..." rows="1"></textarea> <!-- 用户输入框 -->
                <button id="send-button" title="发送">
                    <i class="fas fa-paper-plane"></i> <!-- 发送图标 -->
                </button>
            </div>

            <!-- 对话存储控制按钮 -->
            <div class="storage-controls">
                 <!-- 保存按钮 -->
                 <button id="save-button" title="保存对话">
                    <i class="fas fa-save"></i> 保存
                </button>
                <!-- 加载按钮 (使用 label 包装 input[type=file]) -->
                <label for="load-input" class="load-button" title="加载对话">
                    <i class="fas fa-upload"></i> 加载
                </label>
                <input type="file" id="load-input" accept=".json" style="display: none;"> <!-- 隐藏的文件选择框 -->
                
                <!-- 【新增】手动生成回复按钮 -->
                <button id="manual-generate-button" title="基于当前上下文生成 AI 回复">
                    <i class="fas fa-magic"></i> 生成回复
                </button>

                 <!-- 清空按钮 -->
                 <button id="clear-button" title="清空对话">
                     <i class="fas fa-trash-alt"></i> 清空
                 </button>
            </div>
        </div>
    </div>

    <!-- 设置模态弹窗 -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <!-- 关闭按钮 -->
            <span class="close-button" title="关闭">×</span>
            <h2>设置</h2>

            <!-- API Key 输入 -->
            <div class="setting-item">
                <label for="api-key">API Key:</label>
                <input type="password" id="api-key" placeholder="输入你的 DeepSeek API Key">
            </div>

            <!-- 【新增】API URL 选择 -->
            <div class="setting-item">
                <label for="api-url-select">API 地址 (Base URL):</label>
                <select id="api-url-select">
                    <option value="https://api.deepseek.com" selected>标准版 (api.deepseek.com)</option>
                    <option value="custom">自定义地址...</option>
                </select>
                <!-- 自定义 URL 输入框 (默认隐藏) -->
                <input type="text" id="custom-url-input" class="custom-input hidden" placeholder="输入自定义 Base URL (例如 https://my-proxy.com)">
            </div>

            <!-- 【修改】模型选择 (支持自定义) -->
            <div class="setting-item">
                <label for="model-select">模型:</label>
                <select id="model-select">
                    <option value="deepseek-v4-flash">deepseek-v4-flash</option>
                    <option value="deepseek-v4-pro" selected>deepseek-v4-pro</option>
                    <option value="custom">自定义模型...</option>
                </select>
                <!-- 自定义模型输入框 (默认隐藏) -->
                <input type="text" id="custom-model-input" class="custom-input hidden" placeholder="输入模型名称 (例如 gpt-4o)">
            </div>

            <!-- 思考强度 (Reasoning Effort) - 仅对 deepseek-v4-pro 生效 -->
            <div class="setting-item">
                <label for="reasoning-effort">思考强度 (Reasoning Effort):</label>
                <select id="reasoning-effort">
                    <option value="low" selected>低 (Low)（默认）</option>
                    <option value="medium">中 (Medium)</option>
                    <option value="high">高 (High)</option>
                    <option value="custom">自定义...</option>
                </select>
                <!-- 自定义思考强度输入框 (默认隐藏) -->
                <input type="text" id="reasoning-effort-custom" class="custom-input hidden" placeholder="输入自定义思考强度值 (例如 medium 或数值)">
                <span class="setting-description">控制推理模型的思考深度，仅对 reasoner 模型有效。值越高思考越深入，但耗时越长。选择“自定义”后可输入任意值。</span>
            </div>

            <!-- 思考模式 (Thinking Mode) -->
            <div class="setting-item">
                <label>思考模式 (Thinking Mode):</label>
                <label>
                    <input type="checkbox" id="thinking-mode-enabled" checked>
                    <span id="thinking-mode-label">启用 (Enabled)</span>
                </label>
                <span class="setting-description">开启时发送 {"thinking": {"type": "enabled"}}，关闭时发送 {"thinking": {"type": "disabled"}}。取消勾选后默认隐藏思维链气泡。</span>
            </div>

            <!-- 温度 (Temperature) -->
            <div class="setting-item">
                <label for="temperature">随机性 (Temperature) (<span id="temp-value">0.7</span>):</label>
                <input type="range" id="temperature" min="0" max="2" step="0.1" value="0.7">
                <span class="setting-description">值越高越随机，越低越稳定。</span>
            </div>

             <!-- 核采样 (Top P) -->
             <div class="setting-item">
                 <label for="top-p">核采样 (Top P) (<span id="top-p-value">1.0</span>):</label>
                 <input type="range" id="top-p" min="0" max="1" step="0.05" value="1.0">
                 <span class="setting-description">建议只调整 Temperature 或 Top P 其中之一。</span>
             </div>

            <!-- 最大令牌数 (Max Tokens) -->
            <div class="setting-item">
                <label for="max-tokens">最大令牌数 (Max Tokens):</label>
                <input type="number" id="max-tokens" min="1" max="8192" step="1" placeholder="默认 4096">
                 <span class="setting-description">限制 AI 回复的最大长度。</span>
            </div>

             <!-- 停止符 (Stop Sequences) -->
             <div class="setting-item">
                 <label for="stop-sequences">停止符 (Stop Sequences):</label>
                 <input type="text" id="stop-sequences" placeholder="可选, 英文逗号分隔, 如 stop,end">
                  <span class="setting-description">遇到这些词语时停止生成。</span>
             </div>

            <!-- 频率惩罚 (Frequency Penalty) -->
            <div class="setting-item">
                <label for="frequency-penalty">频率惩罚 (<span id="freq-penalty-value">0.5</span>):</label>
                <input type="range" id="frequency-penalty" min="-2" max="2" step="0.1" value="0.5">
                 <span class="setting-description">正值降低重复内容。</span>
            </div>

            <!-- 存在惩罚 (Presence Penalty) -->
            <div class="setting-item">
                <label for="presence-penalty">存在惩罚 (<span id="pres-penalty-value">0.0</span>):</label>
                <input type="range" id="presence-penalty" min="-2" max="2" step="0.1" value="0.0">
                 <span class="setting-description">正值鼓励谈论新主题。</span>
            </div>


            <!-- 预设提示词选择 -->
            <div class="setting-item">
                <label for="predefined-prompt-select">选择提示词模板:</label>
                <select id="predefined-prompt-select">
                    <!-- 选项将由 JavaScript 动态填充 -->
                </select>
            </div>

            <!-- 自定义系统提示词 -->
            <div class="setting-item">
                <label for="system-prompt">系统提示词 (System Prompt):</label>
                <textarea id="system-prompt" rows="4" placeholder="选择上方的模板或在此处输入自定义提示词"></textarea>
            </div>

            <!-- 思维链默认可见 -->
             <div class="setting-item">
                 <label>
                    <input type="checkbox" id="reasoning-default-visible" checked> 默认显示思维链
                 </label>
            </div>
        </div>
    </div>

    <!-- JavaScript 文件引用 -->
    <script src="js/marked.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
